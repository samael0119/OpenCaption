name: opencaption
description: Local-first English to Chinese interview captions.
publish_to: none
version: 0.1.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/corpora/
    - assets/models.json
    - assets/native_licenses.txt
